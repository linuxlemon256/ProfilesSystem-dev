name: Deploy ProfilesSystem-dev to local VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # 这个 Runner 必须安装在 192.168.3.10 虚拟机内。
    # GitHub 托管 Runner 无法直接访问 192.168.x.x 内网地址。
    runs-on: [self-hosted, linux, x64, profiles-dev]
    env:
      APP_DIR: /home/user/profiles-system-dev
      SERVICE_NAME: profiles-system-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests clean package

      - name: Install application and restart service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APP_DIR"
          ARTIFACT=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)
          test -n "$ARTIFACT"
          install -m 0644 "$ARTIFACT" "$APP_DIR/app.jar"
          sudo systemctl restart "$SERVICE_NAME"
          sleep 5
          sudo systemctl is-active --quiet "$SERVICE_NAME"
          echo "ProfilesSystem-dev deployed successfully"
