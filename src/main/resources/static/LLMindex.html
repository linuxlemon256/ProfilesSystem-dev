<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM 学习助手 · ProfilesSystem</title>
    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172554; background: #eef3ff; }
      * { box-sizing: border-box; }
      .auth-pending .page { visibility: hidden; }
      body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 10% 0%, #c7d2fe 0, transparent 30%), radial-gradient(circle at 95% 90%, #a5f3fc 0, transparent 28%), linear-gradient(135deg, #eef3ff, #f8fafc 58%, #f1edff); }
      .page { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 34px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
      .brand { display: flex; align-items: center; gap: 10px; color: #172554; font-size: 14px; font-weight: 800; }
      .mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; color: #111a3b; background: linear-gradient(135deg, #9ca9ff, #62e4d5); }
      .back { color: #4f46e5; font-size: 13px; font-weight: 700; text-decoration: none; }
      .back:hover { color: #0891b2; }
      .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; }
      .intro, .chat { border: 1px solid #dce5f5; border-radius: 24px; background: #ffffffd9; box-shadow: 0 20px 50px #30458e15; }
      .intro { padding: 25px; }
      .assistant-icon { display: grid; width: 54px; height: 54px; place-items: center; margin-bottom: 22px; border-radius: 17px; color: #fff; background: linear-gradient(135deg, #4f46e5, #0891b2); font-size: 25px; box-shadow: 0 12px 25px #4f46e532; }
      .eyebrow { margin: 0 0 8px; color: #4f46e5; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; color: #172554; font-size: 27px; letter-spacing: -.04em; }
      .intro p { color: #64748b; font-size: 13px; line-height: 1.75; }
      .status { display: inline-flex; align-items: center; gap: 7px; margin-top: 16px; padding: 8px 10px; border-radius: 10px; color: #64748b; background: #f1f5f9; font-size: 11px; }
      .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; }
      .quota { margin-top: 12px; padding: 11px 12px; border: 1px solid #dbe4ff; border-radius: 12px; color: #4f46e5; background: #f8faff; font-size: 12px; line-height: 1.6; }
      .chat { display: flex; height: min(650px, calc(100vh - 150px)); min-height: 520px; flex-direction: column; overflow: hidden; }
      .chat-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid #e8edf7; background: #ffffffa8; }
      .chat-head strong { font-size: 15px; }
      .chat-head span { color: #94a3b8; font-size: 11px; }
      .chat-head-actions { display: flex; align-items: center; gap: 10px; }
      .clear-chat { border: 1px solid #c7d2fe; border-radius: 9px; padding: 6px 9px; color: #4f46e5; background: #eef2ff; font: inherit; font-size: 11px; font-weight: 800; cursor: pointer; }
      .clear-chat:hover { color: #fff; background: #6366f1; box-shadow: 0 6px 14px #6366f144; }
      .messages { flex: 1; min-height: 0; padding: 24px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #c7d2fe transparent; }
      .messages::-webkit-scrollbar { width: 7px; }
      .messages::-webkit-scrollbar-thumb { border-radius: 99px; background: #c7d2fe; }
      .message { display: flex; gap: 10px; max-width: 80%; margin-bottom: 18px; }
      .message.user { margin-left: auto; flex-direction: row-reverse; }
      .bubble-icon { display: grid; flex: none; width: 28px; height: 28px; place-items: center; border-radius: 9px; color: #fff; background: #6366f1; font-size: 12px; }
      .message.user .bubble-icon { background: #0f1735; }
      .bubble { padding: 12px 14px; border: 1px solid #e1e7f4; border-radius: 4px 15px 15px; color: #475569; background: #f8fafc; font-size: 13px; line-height: 1.75; }
      .message.user .bubble { border-color: #c7d2fe; border-radius: 15px 4px 15px 15px; color: #312e81; background: #eef2ff; }
      .composer { display: flex; gap: 10px; padding: 17px; border-top: 1px solid #e8edf7; background: #ffffffb8; }
      .composer input { min-width: 0; flex: 1; padding: 13px 14px; border: 1px solid #dce5f5; border-radius: 12px; outline: none; color: #172554; background: #fff; font: inherit; font-size: 13px; }
      .composer input:focus { border-color: #818cf8; box-shadow: 0 0 0 4px #818cf81c; }
      .composer button { padding: 0 18px; border: 0; border-radius: 12px; color: #fff; background: #4f46e5; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
      .composer button:hover { background: #4338ca; }
      .composer button:disabled { opacity: .6; cursor: wait; }
      .typing { color: #6366f1 !important; animation: llmPulse 1.2s ease-in-out infinite; }
      @keyframes llmPulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @media (max-width: 700px) { .page { width: min(100% - 22px, 600px); padding-top: 18px; } .layout { grid-template-columns: 1fr; } .intro { padding: 20px; } .assistant-icon { display: inline-grid; margin: 0 12px 0 0; vertical-align: middle; } .intro h1 { display: inline; font-size: 23px; } .intro p { margin-bottom: 0; } .chat { height: 540px; min-height: 0; } .message { max-width: 92%; } }
    </style>
    <style id="profiles-motion">
    @keyframes profilesPageIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes profilesRiseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    body { animation: profilesPageIn .45s ease-out both; }
    body > main, body > .page, body > .shell { animation: profilesRiseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    a, button, input, textarea, select { transition: color .2s ease, background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease, opacity .2s ease; }
    a:hover { filter: brightness(1.04); }
    button:hover:not(:disabled) { transform: translateY(-2px); }
    input:focus, textarea:focus, select:focus { box-shadow: 0 0 0 3px #6366f126; }
    article, .card, .panel, .stat, .hero, .section, .box { animation: profilesRiseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) {
      body, body > main, body > .page, body > .shell, article, .card, .panel, .stat, .hero, .section, .box { animation: none !important; }
      a, button, input, textarea, select { transition: none !important; }
    }
  </style></head>
  <body>
    <main class="page">
      <header class="topbar"><div class="brand"><span class="mark">P</span><span>ProfilesSystem · AI 学习空间</span></div><a class="back" href="learnIndex.html">← 返回专业选择</a></header>
      <section class="layout">
        <aside class="intro">
          <div class="assistant-icon">✦</div>
          <p class="eyebrow">Your study copilot</p>
          <h1>LLM 学习助手</h1>
          <p id="assistantDescription">遇到知识点、代码问题或学习路线疑惑，都可以先把问题放在这里。正在检查模型服务状态。</p>
          <div class="status" id="assistantStatus">正在检测模型配置…</div>
          <div class="quota" id="quotaStatus">正在读取今日 token 额度…</div>
        </aside>
        <section class="chat" aria-label="AI 对话窗口">
          <div class="chat-head"><strong>和学习助手聊聊</strong><div class="chat-head-actions"><span id="connectionStatus">正在检测模型…</span><button class="clear-chat" id="clearChat" type="button">清空对话</button></div></div>
          <div class="messages" id="messages">
            <div class="message"><div class="bubble-icon">✦</div><div class="bubble" id="welcomeMessage">你好！我是你的学习助手。正在检查后端模型服务状态。</div></div>
            <div class="message user"><div class="bubble-icon">我</div><div class="bubble">那现在可以先做什么？</div></div>
            <div class="message"><div class="bubble-icon">✦</div><div class="bubble">可以先在下方输入一个问题，体验一下对话布局。现在我会先把你的问题记在这里，等真正的 AI 服务上线再认真回答～</div></div>
          </div>
          <form class="composer" id="composer"><input id="prompt" type="text" maxlength="4000" placeholder="输入你想问的问题…" autocomplete="off" /><button id="sendButton" type="submit">发送</button></form>
        </section>
      </section>
    </main>
    <script>
      document.body.classList.add("auth-pending");
      const redirectAfterLogin = encodeURIComponent("LLMindex.html");

      async function ensureLogin() {
        try {
          const response = await fetch("/api/user/level", { credentials: "same-origin" });
          if (response.status === 401) throw new Error("not authenticated");
          if (response.status === 403) {
            window.location.replace("accessDenied.html?required=1");
            return;
          }
          if (!response.ok) throw new Error("not authenticated");
          const result = await response.json();
          if (Number(result.code) !== 200) throw new Error("not authenticated");
          if (Number(result.data) < 1) {
            window.location.replace("accessDenied.html?required=1");
            return;
          }
          document.body.classList.remove("auth-pending");
        } catch (error) {
          window.location.replace("login.html?redirect=" + redirectAfterLogin);
        }
      }

      const composer = document.getElementById("composer");
      const prompt = document.getElementById("prompt");
      const messages = document.getElementById("messages");
      const sendButton = document.getElementById("sendButton");
      const connectionStatus = document.getElementById("connectionStatus");
      const clearChat = document.getElementById("clearChat");
      const initialMessages = messages.innerHTML;
      let modelConfigured = false;
      const quotaStatus = document.getElementById("quotaStatus");

      async function loadQuota() {
        try {
          const response = await fetch("/api/llm/quota", { credentials: "same-origin" });
          const result = await response.json();
          if (result.code !== 200) throw new Error(result.message || "额度读取失败");
          quotaStatus.textContent = `今日额度：${result.data.remainingTokens.toLocaleString()} / ${result.data.quotaTokens.toLocaleString()} token · ${result.data.level === 2 ? "内部" : result.data.level === 1 ? "关联" : "游客"}`;
        } catch (error) { quotaStatus.textContent = "token 额度暂不可用"; }
      }

      async function detectModelStatus() {
        try {
          const response = await fetch("/api/llm/status", { credentials: "same-origin" });
          const result = await response.json();
          if (result.code !== 200) throw new Error(result.message || "状态读取失败");
          modelConfigured = Boolean(result.data.configured);
          const providerName = result.data.provider === "ollama" ? "Ollama 本机模型" : result.data.provider === "ollama_external" ? "Ollama 外接模型" : "OpenAPI 云端模型";
          connectionStatus.textContent = result.data.configured ? `${providerName}在线` : "模型服务未配置";
          connectionStatus.title = result.data.configured ? `${result.data.modelName || "模型"} · ${result.data.baseUrl || ""}` : "请由管理员配置模型接入方式、地址和模型名称";
          document.getElementById("assistantStatus").textContent = result.data.configured ? providerName : "模型服务尚未配置";
          document.getElementById("assistantDescription").textContent = result.data.configured ? `当前使用 ${providerName}，问题会由后端统一转发。` : "管理员完成模型配置后即可开始真实对话。";
          document.getElementById("welcomeMessage").textContent = result.data.configured ? `你好！当前由 ${providerName} 为你提供学习辅助。请描述目标、上下文和遇到的问题。` : "你好！模型服务暂未配置，请稍后再来。";
        } catch (error) {
          connectionStatus.textContent = "状态未知";
          document.getElementById("assistantStatus").textContent = "模型状态未知";
        }
      }

      function appendMessage(text, type) {
        const item = document.createElement("div");
        item.className = "message " + (type === "user" ? "user" : "assistant");
        item.innerHTML = `<div class="bubble-icon">${type === "user" ? "我" : "✦"}</div><div class="bubble"></div>`;
        item.querySelector(".bubble").textContent = text;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
        return item;
      }

      composer.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = prompt.value.trim();
        if (!text) return;
        appendMessage(text, "user");
        prompt.value = "";
        sendButton.disabled = true;
        prompt.disabled = true;
        connectionStatus.textContent = "正在思考…";
        connectionStatus.classList.add("typing");
        try {
          const response = await fetch("/api/llm/chat", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ message: text }) });
          const result = await response.json();
          if (result.code === 401) { window.location.replace("login.html?redirect=LLMindex.html"); return; }
          if (result.code !== 200 || !result.data) throw new Error(result.message || "助手暂时无法回复");
          appendMessage(result.data.reply, "assistant");
          await loadQuota();
          const providerName = result.data.provider === "ollama" ? "Ollama 本机模型" : result.data.provider === "ollama_external" ? "Ollama 外接模型" : "OpenAPI 云端模型";
          connectionStatus.textContent = `${providerName}在线`;
          document.getElementById("assistantStatus").textContent = providerName;
        } catch (error) {
          appendMessage("这次请求没有成功：" + (error.message || "请稍后重试"), "assistant");
          connectionStatus.textContent = "连接异常";
          document.getElementById("assistantStatus").textContent = "模型服务连接异常";
        } finally {
          sendButton.disabled = false;
          prompt.disabled = false;
          connectionStatus.classList.remove("typing");
          prompt.focus();
        }
      });
      clearChat.addEventListener("click", () => { messages.innerHTML = initialMessages; detectModelStatus(); prompt.focus(); });
      detectModelStatus();
      loadQuota();
      ensureLogin();
    </script>
  </body>
</html>
